<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e2e8f0;
    padding: 2px;
    overflow-y: auto;
  }
  .mic-card {
    background: rgba(18, 22, 28, 0.95);
    border: 1.5px solid rgba(88, 193, 200, 0.3);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .title-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #64748b;
    transition: all 0.3s ease;
  }
  .brand-text {
    color: #ffffff;
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.3px;
  }
  .product-badge {
    background: rgba(88, 193, 200, 0.15);
    color: #58c1c8;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .lang-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lang-select {
    background: rgba(11, 15, 25, 0.95);
    color: #58c1c8;
    border: 1px solid rgba(88, 193, 200, 0.35);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }
  .mic-action-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .btn-mic {
    background: #58c1c8;
    color: #0b0f19;
    border: none;
    border-radius: 9999px;
    padding: 8px 20px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 14px rgba(88, 193, 200, 0.3);
    transition: all 0.2s ease;
  }
  .btn-mic:hover {
    background: #7dd3fc;
  }
  .mic-status {
    color: #94a3b8;
    font-size: 12px;
  }
  .live-box {
    display: none;
    background: rgba(88, 193, 200, 0.06);
    border: 1px dashed rgba(88, 193, 200, 0.4);
    border-radius: 8px;
    padding: 7px 12px;
    color: #58c1c8;
    font-size: 12.5px;
    font-style: italic;
    margin-bottom: 10px;
  }
  .textarea-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 10px;
  }
  .textarea-label {
    color: #cbd5e1;
    font-size: 11.5px;
    font-weight: 600;
  }
  .recognized-input {
    width: 100%;
    box-sizing: border-box;
    background: rgba(11, 15, 25, 0.95);
    color: #ffffff;
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.45;
    outline: none;
    resize: vertical;
    min-height: 62px;
    font-family: inherit;
  }
  .recognized-input:focus {
    border-color: #58c1c8;
  }
  .error-box {
    display: none;
    background: rgba(239, 68, 68, 0.1);
    border: 1.5px solid rgba(239, 68, 68, 0.35);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .error-title {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #f87171;
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 2px;
  }
  .error-text {
    color: #cbd5e1;
    font-size: 11px;
    margin: 0;
    line-height: 1.4;
  }
  .action-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: #94a3b8;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-secondary:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.1);
  }
  .btn-submit {
    background: linear-gradient(135deg, #58c1c8 0%, #00F2FE 100%);
    color: #0b0f19;
    border: none;
    border-radius: 6px;
    padding: 7px 18px;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 14px rgba(0, 242, 254, 0.25);
    transition: all 0.2s ease;
  }
  .btn-submit:hover {
    box-shadow: 0 4px 18px rgba(0, 242, 254, 0.45);
  }
</style>
</head>
<body>
  <div class="mic-card">
    <div class="top-row">
      <div class="title-area">
        <div id="micIndicator" class="pulse-dot"></div>
        <span class="brand-text">AI VOICE INPUT</span>
        <span class="product-badge">VOICE AI TUTOR</span>
      </div>
      <div class="lang-group">
        <label style="color: #94a3b8; font-size: 11px;">Language:</label>
        <select id="voiceLang" class="lang-select">
          <option value="en-IN" selected>🇬🇧 English (India)</option>
          <option value="hi-IN">🇮🇳 Hindi (हिंदी)</option>
          <option value="mr-IN">🚩 Marathi (मराठी)</option>
        </select>
      </div>
    </div>

    <div class="mic-action-row">
      <button id="toggleMicBtn" type="button" class="btn-mic">
        <span id="micIcon">🎙️</span>
        <span id="micBtnText">Start Speaking</span>
      </button>
      <span id="micStatusText" class="mic-status">Click to speak your academic doubt or viva answer</span>
    </div>

    <div id="livePreviewContainer" class="live-box">
      <span style="font-weight: 700;">Listening:</span> <span id="liveInterimText">...</span>
    </div>

    <div class="textarea-group">
      <label class="textarea-label">Recognized Text (Review & Edit before asking):</label>
      <textarea id="recognizedTextArea" class="recognized-input" placeholder="Your spoken question will appear here in real time. You can edit before submitting..."></textarea>
    </div>

    <div id="micErrorNotice" class="error-box">
      <div class="error-title">
        <span>⚠️ Microphone Permission Needed</span>
      </div>
      <p id="micErrorMsg" class="error-text">
        Microphone access was denied. Please allow microphone permissions in your browser or type your question in the text box.
      </p>
    </div>

    <div class="action-bar">
      <button id="clearSpokenBtn" type="button" class="btn-secondary">Clear</button>
      <button id="copySpokenBtn" type="button" class="btn-secondary">📋 Copy Text</button>
      <button id="sendVoiceQueryBtn" type="button" class="btn-submit">
        <span id="submitLabelText">Submit Voice Doubt ⚡</span>
      </button>
    </div>
  </div>

  <script>
  (function() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const toggleBtn = document.getElementById('toggleMicBtn');
    const micIcon = document.getElementById('micIcon');
    const micBtnText = document.getElementById('micBtnText');
    const statusText = document.getElementById('micStatusText');
    const indicator = document.getElementById('micIndicator');
    const langSelect = document.getElementById('voiceLang');
    const textArea = document.getElementById('recognizedTextArea');
    const liveContainer = document.getElementById('livePreviewContainer');
    const liveText = document.getElementById('liveInterimText');
    const errorBox = document.getElementById('micErrorNotice');
    const errorMsg = document.getElementById('micErrorMsg');
    const clearBtn = document.getElementById('clearSpokenBtn');
    const copyBtn = document.getElementById('copySpokenBtn');
    const sendBtn = document.getElementById('sendVoiceQueryBtn');
    const submitLabelSpan = document.getElementById('submitLabelText');

    let recognition = null;
    let isListening = false;

    // Streamlit Component Protocol Handshake
    function sendStreamlitReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:componentReady',
        apiVersion: 1
      }, '*');
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:setFrameHeight',
        height: 310
      }, '*');
    }

    window.addEventListener('load', sendStreamlitReady);

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'streamlit:render') {
        const args = event.data.args || {};
        if (args.submit_label && submitLabelSpan) {
          submitLabelSpan.innerText = args.submit_label;
        }
      }
    });

    if (!SpeechRecognition) {
      statusText.innerText = "Browser voice recognition not supported. Please type your doubt in the box.";
      toggleBtn.disabled = true;
      toggleBtn.style.opacity = "0.5";
    }

    function setListeningUI(active) {
      if (active) {
        toggleBtn.style.background = "#ef4444";
        micIcon.innerText = "🔴";
        micBtnText.innerText = "Stop Listening";
        statusText.innerText = "Listening... Speak clearly";
        statusText.style.color = "#f87171";
        indicator.style.background = "#ef4444";
        indicator.style.boxShadow = "0 0 10px #ef4444";
        liveContainer.style.display = "block";
        errorBox.style.display = "none";
      } else {
        toggleBtn.style.background = "#58c1c8";
        micIcon.innerText = "🎙️";
        micBtnText.innerText = "Start Speaking";
        statusText.innerText = "Stopped. Review your text or click Submit.";
        statusText.style.color = "#94a3b8";
        indicator.style.background = "#64748b";
        indicator.style.boxShadow = "none";
        liveContainer.style.display = "none";
      }
    }

    function startListening() {
      if (!SpeechRecognition) return;
      stopListening();
      try {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = langSelect.value || 'en-IN';

        recognition.onstart = function() {
          isListening = true;
          setListeningUI(true);
        };

        recognition.onresult = function(event) {
          let interimTranscript = '';
          let finalTranscript = '';

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalTranscript += transcript + ' ';
            } else {
              interimTranscript += transcript;
            }
          }

          if (interimTranscript) {
            liveText.innerText = interimTranscript;
          }

          if (finalTranscript) {
            const currentVal = textArea.value ? textArea.value.trim() + ' ' : '';
            textArea.value = currentVal + finalTranscript.trim();
            liveText.innerText = '...';
          }
        };

        recognition.onerror = function(event) {
          console.warn('SpeechRecognition error:', event.error);
          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            errorBox.style.display = "block";
            errorMsg.innerText = "Microphone access blocked. Click lock icon in browser URL bar to allow.";
          } else if (event.error === 'no-speech') {
            statusText.innerText = "No speech detected. Click Start Speaking and try again.";
          }
          stopListening();
        };

        recognition.onend = function() {
          if (!isListening) {
            setListeningUI(false);
          }
        };

        isListening = true;
        setListeningUI(true);
        recognition.start();
      } catch (err) {
        console.error('Failed to start speech recognition:', err);
        stopListening();
      }
    }

    function stopListening() {
      isListening = false;
      if (recognition) {
        try { recognition.abort(); } catch(e) {}
        try { recognition.stop(); } catch(e) {}
        recognition = null;
      }
      setListeningUI(false);
    }

    toggleBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    });

    langSelect.addEventListener('change', function() {
      if (isListening) {
        stopListening();
        startListening();
      }
    });

    clearBtn.addEventListener('click', function(e) {
      e.preventDefault();
      textArea.value = '';
      liveText.innerText = '...';
    });

    copyBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const val = textArea.value.trim();
      if (!val) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(function() {
          copyBtn.innerText = "✓ Copied!";
          setTimeout(function() { copyBtn.innerText = "📋 Copy Text"; }, 2000);
        }).catch(function() {
          textArea.select();
          document.execCommand('copy');
          copyBtn.innerText = "✓ Copied!";
          setTimeout(function() { copyBtn.innerText = "📋 Copy Text"; }, 2000);
        });
      } else {
        textArea.select();
        document.execCommand('copy');
        copyBtn.innerText = "✓ Copied!";
        setTimeout(function() { copyBtn.innerText = "📋 Copy Text"; }, 2000);
      }
    });

    sendBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const queryText = textArea.value.trim();
      if (!queryText) {
        statusText.innerText = "Please speak or type a doubt before submitting.";
        statusText.style.color = "#f87171";
        return;
      }

      // Immediately stop microphone and reset listening UI
      stopListening();

      sendBtn.disabled = true;
      sendBtn.style.opacity = "0.7";
      statusText.innerText = "Submitting to AI Tutor...";
      statusText.style.color = "#58c1c8";

      // Send to Streamlit via official component postMessage:
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:setComponentValue',
        value: queryText
      }, '*');

      // Also copy to clipboard quietly as backup without any popup
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(queryText);
      }
    });
  })();
  </script>
</body>
</html>
