<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e2e8f0;
    padding: 2px;
    overflow: hidden;
  }
  .mic-card {
    background: rgba(18, 22, 28, 0.95);
    border: 1.5px solid rgba(88, 193, 200, 0.3);
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }
  .ctrl-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .left-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-mic {
    background: #58c1c8;
    color: #0b0f19;
    border: none;
    border-radius: 9999px;
    padding: 6px 16px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 10px rgba(88, 193, 200, 0.25);
    transition: all 0.2s ease;
  }
  .btn-mic:hover {
    background: #7dd3fc;
  }
  .lang-select {
    background: rgba(11, 15, 25, 0.95);
    color: #58c1c8;
    border: 1px solid rgba(88, 193, 200, 0.35);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }
  .mic-status {
    color: #94a3b8;
    font-size: 11.5px;
  }
  .live-box {
    display: none;
    background: rgba(88, 193, 200, 0.06);
    border: 1px dashed rgba(88, 193, 200, 0.4);
    border-radius: 6px;
    padding: 4px 10px;
    color: #58c1c8;
    font-size: 11.5px;
    font-style: italic;
    margin-bottom: 6px;
  }
  .recognized-input {
    width: 100%;
    box-sizing: border-box;
    background: rgba(11, 15, 25, 0.95);
    color: #ffffff;
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 13px;
    line-height: 1.4;
    outline: none;
    resize: vertical;
    height: 52px;
    min-height: 48px;
    font-family: inherit;
    margin-bottom: 8px;
  }
  .recognized-input:focus {
    border-color: #58c1c8;
  }
  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .hint-text {
    color: #94a3b8;
    font-size: 11px;
  }
  .right-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-clear {
    background: rgba(255, 255, 255, 0.05);
    color: #94a3b8;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-clear:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.1);
  }
  .btn-submit {
    background: linear-gradient(135deg, #58c1c8 0%, #00F2FE 100%);
    color: #0b0f19;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 3px 12px rgba(0, 242, 254, 0.25);
    transition: all 0.2s ease;
  }
  .btn-submit:hover {
    box-shadow: 0 4px 16px rgba(0, 242, 254, 0.45);
  }
  .error-box {
    display: none;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 6px;
    color: #f87171;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="mic-card">
    <div class="ctrl-bar">
      <div class="left-controls">
        <button id="toggleMicBtn" type="button" class="btn-mic">
          <span id="micIcon">🎙️</span>
          <span id="micBtnText">Start Speaking</span>
        </button>
        <select id="voiceLang" class="lang-select">
          <option value="en-IN" selected>🇬🇧 English (India)</option>
          <option value="hi-IN">🇮🇳 Hindi (हिंदी)</option>
          <option value="mr-IN">🚩 Marathi (मराठी)</option>
        </select>
        <span id="micStatusText" class="mic-status">Click to speak or type directly below</span>
      </div>
    </div>

    <div id="livePreviewContainer" class="live-box">
      <span style="font-weight: 700;">Listening:</span> <span id="liveInterimText">...</span>
    </div>

    <div id="micErrorNotice" class="error-box">
      <span id="micErrorMsg">Microphone access blocked. Click lock icon in browser URL bar to allow, or type below.</span>
    </div>

    <textarea id="recognizedTextArea" class="recognized-input" rows="2" placeholder="Speak your doubt or type directly here..."></textarea>

    <div class="action-bar">
      <span id="textareaLabel" class="hint-text">Review or edit above before submitting</span>
      <div class="right-actions">
        <button id="clearSpokenBtn" type="button" class="btn-clear">Clear</button>
        <button id="sendVoiceQueryBtn" type="button" class="btn-submit">
          <span id="submitLabelText">Submit Voice Doubt ⚡</span>
        </button>
      </div>
    </div>
  </div>

  <script>
  (function() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const toggleBtn = document.getElementById('toggleMicBtn');
    const micIcon = document.getElementById('micIcon');
    const micBtnText = document.getElementById('micBtnText');
    const statusText = document.getElementById('micStatusText');
    const langSelect = document.getElementById('voiceLang');
    const textArea = document.getElementById('recognizedTextArea');
    const liveContainer = document.getElementById('livePreviewContainer');
    const liveText = document.getElementById('liveInterimText');
    const errorBox = document.getElementById('micErrorNotice');
    const errorMsg = document.getElementById('micErrorMsg');
    const clearBtn = document.getElementById('clearSpokenBtn');
    const sendBtn = document.getElementById('sendVoiceQueryBtn');
    const submitLabelSpan = document.getElementById('submitLabelText');
    const hintLabel = document.getElementById('textareaLabel');

    let recognition = null;
    let isListening = false;
    let statusSubmitting = "Submitting to AI Tutor...";

    function sendStreamlitReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:componentReady',
        apiVersion: 1
      }, '*');
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:setFrameHeight',
        height: 165
      }, '*');
    }

    window.addEventListener('load', sendStreamlitReady);

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'streamlit:render') {
        const args = event.data.args || {};
        if (args.submit_label && submitLabelSpan) {
          submitLabelSpan.innerText = args.submit_label;
        }
        if (args.placeholder && textArea) {
          textArea.placeholder = args.placeholder;
        }
        if (args.textarea_label && hintLabel) {
          hintLabel.innerText = args.textarea_label;
        }
        if (args.status_submitting) {
          statusSubmitting = args.status_submitting;
        }
        if (args.status_idle && statusText && !isListening) {
          statusText.innerText = args.status_idle;
        }
      }
    });

    if (!SpeechRecognition) {
      statusText.innerText = "Browser voice recognition not supported. You can type directly in the box.";
      toggleBtn.disabled = true;
      toggleBtn.style.opacity = "0.5";
    }

    function setListeningUI(active) {
      if (active) {
        toggleBtn.style.background = "#ef4444";
        micIcon.innerText = "🔴";
        micBtnText.innerText = "Stop Listening";
        statusText.innerText = "Listening... Speak clearly";
        statusText.style.color = "#f87171";
        liveContainer.style.display = "block";
        errorBox.style.display = "none";
      } else {
        toggleBtn.style.background = "#58c1c8";
        micIcon.innerText = "🎙️";
        micBtnText.innerText = "Start Speaking";
        statusText.innerText = "Stopped. Review your text or click Submit.";
        statusText.style.color = "#94a3b8";
        liveContainer.style.display = "none";
      }
    }

    function startListening() {
      if (!SpeechRecognition) return;
      stopListening();
      try {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = langSelect.value || 'en-IN';

        recognition.onstart = function() {
          isListening = true;
          setListeningUI(true);
        };

        recognition.onresult = function(event) {
          let interimTranscript = '';
          let finalTranscript = '';

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalTranscript += transcript + ' ';
            } else {
              interimTranscript += transcript;
            }
          }

          if (interimTranscript) {
            liveText.innerText = interimTranscript;
          }

          if (finalTranscript) {
            const currentVal = textArea.value ? textArea.value.trim() + ' ' : '';
            textArea.value = currentVal + finalTranscript.trim();
            liveText.innerText = '...';
          }
        };

        recognition.onerror = function(event) {
          console.warn('SpeechRecognition error:', event.error);
          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            errorBox.style.display = "block";
            errorMsg.innerText = "Microphone access blocked. Click lock icon in browser URL bar to allow.";
          } else if (event.error === 'no-speech') {
            statusText.innerText = "No speech detected. Click Start Speaking and try again.";
          }
          stopListening();
        };

        recognition.onend = function() {
          if (!isListening) {
            setListeningUI(false);
          }
        };

        isListening = true;
        setListeningUI(true);
        recognition.start();
      } catch (err) {
        console.error('Failed to start speech recognition:', err);
        stopListening();
      }
    }

    function stopListening() {
      isListening = false;
      if (recognition) {
        try { recognition.abort(); } catch(e) {}
        try { recognition.stop(); } catch(e) {}
        recognition = null;
      }
      setListeningUI(false);
    }

    toggleBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    });

    langSelect.addEventListener('change', function() {
      if (isListening) {
        stopListening();
        startListening();
      }
    });

    clearBtn.addEventListener('click', function(e) {
      e.preventDefault();
      textArea.value = '';
      liveText.innerText = '...';
    });

    sendBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const queryText = textArea.value.trim();
      if (!queryText) {
        statusText.innerText = "Please speak or type before submitting.";
        statusText.style.color = "#f87171";
        return;
      }

      stopListening();
      sendBtn.disabled = true;
      sendBtn.style.opacity = "0.7";
      statusText.innerText = statusSubmitting;
      statusText.style.color = "#58c1c8";

      // 1-Click Streamlit Component submission
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:setComponentValue',
        value: queryText
      }, '*');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(queryText);
      }
    });
  })();
  </script>
</body>
</html>
